name: Generate Region Pages

on:
  workflow_dispatch: # 允许您在 Actions 页面手动点按钮运行
  push:
    paths:
      - 'generate_regions.py' # 每次修改 generate_regions.py 时自动运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script to generate pages
        run: python generate_regions.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Auto-generate region pages via Python script"
          branch: main
